# 计划 Agent：PRD → WBS 与任务树
id: planner-agent
display_name: 计划 Agent
concepts: [task, requirement]
model:
  provider: openai_compat
  name: gpt-4.1-mini
  temperature: 0.2
system_prompt_file: prompts/roles/planner-agent.md
tools: [read_artifact, write_artifact, search_assets, read_asset, link_asset]
output:
  artifact: artifacts/wbs.md
  artifact_kind: wbs
  schema: schemas/wbs.schema.json
  on_complete: request_gate_approval
  gate: plan_review
  apply:
    kind: create_items        # 批准后按 WBS 建工作项
    concept: task
limits: {max_steps: 12, max_tokens_per_run: 60000}
